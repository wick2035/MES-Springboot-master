server:
  session-timeout: 1800
spring:
  profiles:
    active: dev
  cache:
    type: ehcache
    ehcache:
      config: classpath:ehcache.xml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

mes:
  file:
    upload-path: D:/mes/upload
    access-prefix: /upload

swagger:
  controller: com.wangziyang.mes
  description: MES接口管理
  enable: true
  license: wangziyang
  licenseUrl: https://gitee.com/wangziyangyang/MES-Sprongboot
  title: 王子杨的API 管理
  version: 1.0.0

logging:
  config: classpath:logback.xml
